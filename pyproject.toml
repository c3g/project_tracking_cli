[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "pt_cli"
dynamic = ["version"]
authors = [
  { name="P-O Quirion", email="po.quirion@mcgill.ca" },
  { name="Paul Streteowich", email="paul.stretenowich@mcgill.ca" },
]
description = "python client for the DB to track C3G assembler"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "html5lib",
    "shtab",
]

[project.optional-dependencies]
# Login to an API that checks COmanage tokens itself (AUTH_MODE 'oidc')
oidc = ["c3g-oidc>=0.2.0"]

[project.scripts]
pt-cli =  "pt_cli.cli:main"

[project.urls]
"Homepage" = "https://github.com/C3G/pt_cli"
"Bug Tracker" = "https://github.com/pypa/pt_cli/issues"

[tool.pdm]
allow-direct-references = true

[tool.pdm.version]
source = "file"
path = "pt_cli/__version__.py"
